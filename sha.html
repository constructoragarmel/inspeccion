    catch (err) { _ocToast('⚠️ ' + _ofiMensaje(err)); if (boton) { boton.disabled = false; boton.textContent = 'Copiar'; } return; }
    // El estado de una torre se arma con la misma función que lo arma para la visita anterior (anotarEstadoTorre):
    // así SHA y urbanismo lo arman con sus propios campos. Se usa una llave de paso y se borra.
    const d = JSON.parse(JSON.stringify(r.datos || {}));
    d.torre = '__copia__'; d.id = 'copia-' + Date.now(); d.fecha = d.fecha || f.fecha || '1970-01-01'; d.guardado = d.guardado || new Date().toISOString();
    if (Array.isArray(d.estatus)) d.estatus = d.estatus[0] || '';
    d.residente = d.residente || (Array.isArray(d.residentes) ? d.residentes[0] : '') || '';
    const todos0 = estadosDeTorres(); delete todos0['__copia__']; localStorage.setItem(CLAVE_TORRES, JSON.stringify(todos0));
    anotarEstadoTorre(d);
    const todos1 = estadosDeTorres(); e = todos1['__copia__']; delete todos1['__copia__']; localStorage.setItem(CLAVE_TORRES, JSON.stringify(todos1));
    if (!e) { _ocToast('⚠️ Ese informe no tiene respuestas que copiar'); if (boton) { boton.disabled = false; boton.textContent = 'Copiar'; } return; }
  }
  if (!_copiarPuede()) { if (caja) caja.innerHTML = ''; return; }
  _copiarAplicar(e, f);
}
// Vuelca la fuente con traerHistorial, la función del motor para la visita anterior (cada formulario tiene la suya):
// se inyecta como estado de ESTA torre, se trae y se restaura. Lo que no es respuesta (estatus, residente, empresa,
// convenio) no viaja.
function _copiarAplicar(e, f){
  const t = _ofiTorre();
  const fuente = JSON.parse(JSON.stringify(e));
  ['convenio', 'estatus', 'residente', 'empresa'].forEach(function(k){ delete fuente[k]; });
  fuente.nro = f.nro; fuente.id = 'copia-' + f.nro;
  const todos = estadosDeTorres(); const previo = todos[t];
  todos[t] = fuente; localStorage.setItem(CLAVE_TORRES, JSON.stringify(todos));
  try { traerHistorial(); }
  finally { const t2 = estadosDeTorres(); if (previo) t2[t] = previo; else delete t2[t]; localStorage.setItem(CLAVE_TORRES, JSON.stringify(t2)); }
  _copiaDe = { nro: f.nro, torre: f.torre, fecha: f.fecha || '' };
  _copiarRotular();
  const caja = document.getElementById('copiar-de'); if (caja) caja.innerHTML = '';
  const ant = document.getElementById('aviso-historial'); if (ant) ant.innerHTML = '';
  const n = _copiadasSinConfirmar(datosDelFormulario());
  _ocToast('📋 ' + n + ' respuesta(s) copiadas de ' + f.torre + '. Confirme cada una en sitio o corríjala.');
  marcar();
}
// Las respuestas copiadas llevan su etiqueta, que es también el botón para confirmarlas.
function _copiarRotular(){
  if (!_copiaDe) return;
  document.querySelectorAll('.item.heredado, .fila-apto.heredado').forEach(function(el){
    if (el.dataset.heredado !== _copiaDe.nro) return;
    el.classList.add('copiada');
    const tag = el.querySelector('.etq-her'); if (!tag) return;
    tag.textContent = '≈ copiado de ' + _copiaDe.torre + ' · tocar para confirmar';
    tag.onclick = function(ev){ ev.stopPropagation(); _copiarConfirmar(el); };
  });
}
function _copiarConfirmar(el){
  el.classList.remove('heredado', 'copiada'); delete el.dataset.heredado;
  const tag = el.querySelector('.etq-her'); if (tag) { tag.textContent = 'visita anterior'; tag.onclick = null; }
  actualizarCuentas(); marcar();
}
function _copiadasSinConfirmar(d){
  const nro = d && d.copiadoDe && d.copiadoDe.nro; if (!nro) return 0;
  let n = 0;
  (d.general || []).forEach(function(g){ (g.items || []).forEach(function(i){ if (i.heredado === nro) n++; }); });
  (d.apartamentos || []).forEach(function(a){ if (a.heredado === nro) n++; });
  return n;
}
function _copiarAvisoBloqueo(d){
  const n = _copiadasSinConfirmar(d); if (!n) return false;
  alert(n + ' respuesta(s) de ' + d.nro + ' se copiaron de ' + (d.copiadoDe.torre || _OC_LUGAR.otra) + ' y no se han confirmado en sitio.\n\n' +
        'Revise cada una: toque «tocar para confirmar» si está igual, o corrija la respuesta. Hasta entonces el informe no se envía.');
  return true;
}

// ── Envolturas sobre el motor ──────────────────────────────────────────────
(function(){
  const _datosBase = datosDelFormulario;
  datosDelFormulario = function(){
    const d = _datosBase.apply(this, arguments);
    if (_definitiva) d.definitiva = _definitiva;
    if (_oficinaDe) d.oficina = _oficinaDe;
    if (_copiaDe) d.copiadoDe = _copiaDe;
    return d;
  };
  // Un informe abierto en oficina se trabaja: guardar no lo marca «editado después» ni le quita la marca de enviado.
  const _guardarBase = guardar;
  guardar = function(avisar){
    const r = _guardarBase.apply(this, arguments);
    if (_oficinaDe) {
      try {
        const lista = listaGuardada(); const i = lista.findIndex(function(x){ return x && x.id === idActual; });
        if (i >= 0) { lista[i].oficina = _oficinaDe; if (!lista[i].enviado) lista[i].enviado = 'archivado'; delete lista[i].editadoTras; if (_definitiva) lista[i].definitiva = _definitiva; localStorage.setItem(CLAVE_LISTA, JSON.stringify(lista)); }
      } catch (e) {}
    }
    return r;
  };
  const _cargarBase = cargarInforme;
  cargarInforme = function(id){
    const r = _cargarBase.apply(this, arguments);
    const d = listaGuardada().find(function(x){ return x.id === id; });
    if (d && idActual === d.id) {
      _definitiva = d.definitiva || null; _oficinaDe = d.oficina || null; _copiaDe = d.copiadoDe || null;
      _copiarRotular(); _oficinaEstado();
    }
    return r;
  };
  const _vaciarBase = vaciarFormulario;
  vaciarFormulario = function(){ _definitiva = null; _oficinaDe = null; _copiaDe = null; const r = _vaciarBase.apply(this, arguments); _oficinaEstado(); _copiarProgramar(); return r; };
  const _tocadoBase = tocado;
  tocado = function(el){
    const it = el && el.closest ? el.closest('.item, .fila-apto') : null;
    const r = _tocadoBase.apply(this, arguments);
    if (it && it.classList.contains('copiada')) { it.classList.remove('copiada'); const tag = it.querySelector('.etq-her'); if (tag) { tag.textContent = 'visita anterior'; tag.onclick = null; } }
    return r;
  };
  const _enviarBase = enviar;
  enviar = async function(){
    if (_tandaEnCurso) return _enviarBase.apply(this, arguments);
    const actual = datosDelFormulario();
    if (actual.copiadoDe && _copiarAvisoBloqueo(actual)) return;
    // Lo que está en pantalla se guarda antes de mirar la lista: las confirmaciones recién hechas cuentan.
    try { guardar(false); } catch (e) {}
    const malos = listaGuardada().filter(function(x){ return x && !x.enviado && _copiadasSinConfirmar(x); });
    if (malos.length) { _copiarAvisoBloqueo(malos[0]); return; }
    return _enviarBase.apply(this, arguments);
  };
  const _enviarSoloBase = enviarSolo;
  enviarSolo = async function(id){
    const d = listaGuardada().find(function(x){ return x.id === id; });
    if (d && _copiarAvisoBloqueo(d)) return;
    return _enviarSoloBase.apply(this, arguments);
  };
  ['marcar', 'alElegirTorre', 'alElegirConvenio', 'ofrecerHistorial'].forEach(function(nombre){
    const base = window[nombre]; if (typeof base !== 'function') return;
    window[nombre] = function(){ const r = base.apply(this, arguments); _copiarProgramar(); return r; };
  });
  if (document.readyState !== 'loading') setTimeout(_oficinaMostrar, 0); else document.addEventListener('DOMContentLoaded', _oficinaMostrar);
})();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
  // Cuando entra una versión nueva: si nadie ha tocado el formulario se
  // recarga sola; si hay algo escrito, se avisa y se espera. Recargar sobre
  // un informe a medio llenar sería peor que la versión vieja.
  navigator.serviceWorker.addEventListener('message', e => {
    if (!e.data || e.data.garmel !== 'version-nueva') return;
    if (!sucio && !document.querySelectorAll('#filas-apto .fila-apto').length && !document.getElementById('torre').value){
      location.reload(); return;
    }
    const b = document.createElement('div');
    b.style.cssText = 'position:fixed;left:0;right:0;bottom:66px;background:#fef3c7;border-top:1px solid #f59e0b;' +
      'padding:10px 14px;font-size:13px;font-weight:700;text-align:center;z-index:39';
    b.textContent = 'Hay una versión nueva. Guarde y toque aquí para actualizar.';
    b.onclick = () => { guardar(false); location.reload(); };
    document.body.appendChild(b);
  });
}

// ── Arranque ──────────────────────────────────────────────────────────────
(function(){
  const sel = document.getElementById('torre');
  // QC de UX del 7-oct-2026: el mismo orden que en obra (por letra y número: D-08, J-07…, T-01…T-58).
  const natural = t => [t.replace(/-.*/, ''), parseInt(t.replace(/^[^0-9]*/, ''), 10) || 0];
  torresUnicas().sort((a, b) => { const x = natural(a), y = natural(b); return x[0] < y[0] ? -1 : x[0] > y[0] ? 1 : x[1] - y[1]; }).forEach(t => {
    const o = document.createElement('option'); o.value = t; o.textContent = t; sel.appendChild(o);
  });
  sel.onchange = alElegirTorre;
  document.getElementById('convenio').onchange = alElegirConvenio;
  // Y los sectores en el orden del formulario de obra: Simón Bolívar, Simón Rodríguez, Ezequiel Zamora.
  (function(){
    const c = document.getElementById('convenio'), orden = ['Simón Bolívar', 'Simón Rodríguez', 'Ezequiel Zamora'];
    const ops = Array.from(c.options).filter(o => o.value);
    ops.sort((a, b) => { const i = orden.indexOf(a.textContent.trim()), j = orden.indexOf(b.textContent.trim()); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
    ops.forEach(o => c.appendChild(o));
  })();
  // `valueAsDate` y `toISOString()` dan la fecha UTC. Venezuela es UTC−4, así
  // que a partir de las 8 de la noche el formulario abriría con el día
  // siguiente — y esa fecha entra en el número del informe y en el nombre del
  // archivo en Drive.
  const hoy = new Date();
  document.getElementById('fecha').value = hoy.getFullYear() + '-' +
      String(hoy.getMonth() + 1).padStart(2, '0') + '-' +
      String(hoy.getDate()).padStart(2, '0');
  document.getElementById('fecha').onchange = () => { actualizarNro(); marcar(); };
  document.getElementById('estatus').onchange = () => { verRechazo(); marcar(); };
  document.getElementById('obs_general').oninput = marcar;
  if (document.getElementById('actividades')) document.getElementById('actividades').oninput = marcar;
  if (TEST_MODE){
    const a = document.createElement('div'); a.className = 'aviso';
    a.style.margin = '12px'; a.textContent = '⚠️ MODO DE PRUEBA — este informe se archiva como PRUEBA-';
    document.querySelector('.envoltorio').prepend(a);
  }
  pintarGeneral(); pintarApartamentos(); pintarIncidencias(); pintarObstaculos(); addInspector();
  actualizarNro(); actualizarContador(); actualizarCuentas();
  // TODO campo que se toque marca el informe para guardar, sin depender de que
  // cada control lleve su propio disparador. Residente, empresa y observación
  // general no lo llevaban, y lo escrito ahí se perdía al cerrar la app o al
  // abrir otro informe (Skarlet, 14-sep). Inspección lo hace así desde el 27-ago.
  document.addEventListener('input',  e => { tocado(e.target); marcar(); }, true);
  document.addEventListener('change', e => { tocado(e.target); marcar(); }, true);
  const con = () => document.getElementById('conexion').textContent =
    navigator.onLine ? 'en línea' : 'sin señal — el informe queda guardado aquí';
  addEventListener('online', con); addEventListener('offline', con); con();
  // Los informes sin enviar viven en este teléfono y en ningún otro lado: se
  // le pide al navegador que no borre este almacenamiento cuando ande corto
  // de espacio. Inspección lo hace desde el 27-ago.
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  reabrirActual();
})();

function tiposRecordados(){
  let extra = []; try { extra = JSON.parse(localStorage.getItem(CLAVE_TIPOS_INC) || '[]'); } catch(e){}
  return TIPOS_INCIDENCIA.concat(extra.filter(t => TIPOS_INCIDENCIA.indexOf(t) < 0));
}
function aprenderTiposIncidencia(d){
  const nuevos = (d.incidencias || []).map(x => (x.tipo || '').trim()).filter(t => t && TIPOS_INCIDENCIA.indexOf(t) < 0);
  if (!nuevos.length) return;
  let extra = []; try { extra = JSON.parse(localStorage.getItem(CLAVE_TIPOS_INC) || '[]'); } catch(e){}
  nuevos.forEach(t => { if (extra.indexOf(t) < 0) extra.push(t); });
  try { localStorage.setItem(CLAVE_TIPOS_INC, JSON.stringify(extra)); } catch(e){}
}
function pintarIncidencias(){
  const cont = document.getElementById('panel-c');
  cont.innerHTML = '<div class="vacio" id="c-vacio">Todavía no hay incidencias. ' +
    'Registre aquí los accidentes: qué pasó, con fotos, y qué se va a hacer.</div><div id="filas-inc"></div>' +
    '<button type="button" class="btn-add" onclick="addIncidencia()">＋ Agregar incidencia</button>';
}
function addIncidencia(datos){
  const v = document.getElementById('c-vacio'); if (v) v.style.display = 'none';
  const cont = document.getElementById('filas-inc');
  const d = document.createElement('div');
  d.className = 'fila-inc'; d.dataset.k = ++_nInc;
  const lista = tiposRecordados().map(t => '<option>' + t.replace(/</g, '&lt;') + '</option>').join('');
  d.innerHTML = '<span class="etq-her" style="margin:0 0 6px">visita anterior · sin revisar hoy</span>' +
    '<div class="cab"><div style="flex:1"><label class="et" style="margin-top:0">Fecha del accidente</label>' +
    '<input type="date" class="inc-fecha"></div>' +
    '<button type="button" class="quitar" onclick="quitarIncidencia(this)" style="margin-top:22px">✕</button></div>' +
    '<label class="et">Tipo de accidente</label>' +
    '<select class="inc-tipo-sel" onchange="cambioTipoInc(this)"><option value="">\u2014 Elija el tipo \u2014</option>' + lista +
    '<option value="__otro">Otro: escribirlo\u2026</option></select>' +
    '<input type="text" class="inc-tipo" placeholder="Escriba el tipo de accidente" hidden style="margin-top:6px">' +
    '<label class="et">Notas de campo</label>' +
    '<textarea class="inc-notas" placeholder="Qué pasó, dónde, quién, cómo estaba el sitio..."></textarea>' +
    '<label class="et">Acciones a tomar</label>' +
    '<textarea class="inc-acciones" placeholder="Qué se decidió hacer, quién y para cuándo..."></textarea>' +
    '<label class="et">Estado de la incidencia</label>' +
    '<div class="sem">' + ESTADOS_INCIDENCIA.map(e =>
      '<button type="button" data-estado="' + e[0] + '" data-color="' + e[1] + '" onclick="marcarSem(this)">' + e[0] + '</button>').join('') + '</div>' +
    bloqueFotos('fotos-inc-' + _nInc, 'Fotografías de la incidencia');
  cont.appendChild(d);
  if (datos){
    d.querySelector('.inc-fecha').value = datos.fecha || '';
    ponerTipoInc(d, datos.tipo || '');
    d.querySelector('.inc-notas').value = datos.notas || '';
    d.querySelector('.inc-acciones').value = datos.acciones || '';
    ponerSem(d, datos.estado || '');
    pintarFotos(d.querySelector('.fotos'), (datos.fotos || []).map(f => f.dato ? f : { pie: f.pie, dato: f.enDrive ? '' : '…' }));
  } else {
    d.querySelector('.inc-fecha').value = document.getElementById('fecha').value || '';
    ponerSem(d, ESTADOS_INCIDENCIA[0][0]);
    d.querySelector('.inc-tipo-sel').focus();
  }
  marcar();
}
// El tipo: un desplegable con los de base y los que este teléfono ya escribió;
// «Otro» abre el campo de texto. Un desplegable se entiende en cualquier
// teléfono; una lista de sugerencias (datalist) no siempre aparece.
function cambioTipoInc(sel){
  const inp = sel.parentElement.querySelector('.inc-tipo');
  if (sel.value === '__otro'){ inp.hidden = false; inp.value = ''; inp.focus(); }
  else { inp.hidden = true; inp.value = sel.value; }
  marcar();
}
function ponerTipoInc(fila, tipo){
  const sel = fila.querySelector('.inc-tipo-sel'), inp = fila.querySelector('.inc-tipo');
  const enLista = tipo && [...sel.options].some(o => o.value === tipo);
  if (!tipo){ sel.value = ''; inp.hidden = true; inp.value = ''; }
  else if (enLista){ sel.value = tipo; inp.hidden = true; inp.value = tipo; }
  else { sel.value = '__otro'; inp.hidden = false; inp.value = tipo; }
}
function quitarIncidencia(btn){
  btn.closest('.fila-inc').remove();
  if (!document.querySelectorAll('#filas-inc .fila-inc').length){
    const v = document.getElementById('c-vacio'); if (v) v.style.display = '';
  }
  // Las fotos van en IndexedDB por posición (inc:0, inc:1…): al quitar una, las
  // siguientes se corren y hay que reescribirlas. Sin esto, la incidencia que
  // subía mostraba —y enviaba— las fotos de la que se quitó (QC del 21-sep).
  _fotosSucias = true;
  marcar();
}
function ponerSem(fila, estado){
  fila.querySelectorAll('.sem button').forEach(b => {
    const on = b.dataset.estado === estado;
    b.classList.toggle('sem-on', on);
    b.style.background = on ? b.dataset.color : '';
  });
}
function valorSem(fila){
  const b = fila.querySelector('.sem button.sem-on');
  return b ? b.dataset.estado : '';
}
// Tocar el estado que ya tenía lo confirma para hoy (como en Sí/No).
function marcarSem(btn){
  const fila = btn.closest('.fila-inc');
  ponerSem(fila, btn.dataset.estado);
  tocado(btn); marcar();
}
function leerIncidencias(){
  return [...document.querySelectorAll('#filas-inc .fila-inc')].map(f => ({
    fecha: f.querySelector('.inc-fecha').value || '',
    tipo: (f.querySelector('.inc-tipo').value || '').trim(),
    notas: (f.querySelector('.inc-notas').value || '').trim(),
    acciones: (f.querySelector('.inc-acciones').value || '').trim(),
    estado: valorSem(f),
    heredado: f.dataset.heredado || '',
    fotos: leerFotos(f.querySelector('.fotos'))
  }));
}

// ── Desmontaje de obstáculos ──
function obstNumero(el, tope){
  let v = String(el.value || '').replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  if (tope !== undefined && v !== '' && Number(v) > tope) v = String(tope);
  el.value = v;
}
function obstResto(fila){
  const p = fila.querySelector('.obst-pct'), r = fila.querySelector('.obst-resto');
  if (!p || !r) return;
  r.textContent = p.value === '' ? '' : 'Queda ' + (100 - Number(p.value)) + ' %';
}
function pintarObstaculos(){
  const cont = document.getElementById('panel-d');
  if (!cont) return;
  delete cont.dataset.heredado;
  let h = '<div class="obst-intro">Lo que estorba en la torre y hay que retirar. Anote lo <b>retirado a la fecha</b> ' +
          '(el acumulado, no solo lo de hoy) y lo que <b>queda</b>. Lo que no hay ni hubo, déjelo en blanco.</div>' +
          '<div class="obst-de" id="obst-de" hidden></div>';
  OBSTACULOS.forEach(o => {
    h += '<div class="fila-obst" data-id="' + o.id + '"><div class="nombre">' + o.nombre + '</div>' +
      (o.mide === 'pct'
        ? '<div class="obst-campos"><label>% retirado a la fecha, a su criterio' +
          '<input type="text" inputmode="numeric" class="obst-pct" placeholder="0 a 100" oninput="obstNumero(this, 100); obstResto(this.closest(\'.fila-obst\')); marcar()"></label>' +
          '<div class="obst-resto"></div></div>'
        : '<div class="obst-campos"><label>Retirado a la fecha' +
          '<input type="text" inputmode="numeric" class="obst-ret" placeholder="cantidad" oninput="obstNumero(this); marcar()"></label>' +
          '<label>Queda por retirar' +
          '<input type="text" inputmode="numeric" class="obst-queda" placeholder="cantidad" oninput="obstNumero(this); marcar()"></label></div>') +
      '<textarea class="obst-obs" placeholder="Observación…" oninput="marcar()"></textarea></div>';
  });
  h += bloqueFotos('fotos-obst', 'Fotografías de los obstáculos');
  cont.innerHTML = h;
  // En cuanto el inspector toca algo, lo traído de la visita anterior ya es de hoy: no se suelta al cambiar de torre.
  cont.oninput = () => { delete cont.dataset.heredado; };
}
function leerObstaculos(){
  return [...document.querySelectorAll('#panel-d .fila-obst')].map(f => {
    const o = OBSTACULOS.find(x => x.id === f.dataset.id) || {};
    const v = c => { const e = f.querySelector(c); return e ? String(e.value || '').trim() : ''; };
    return { id: f.dataset.id, nombre: o.nombre || '', mide: o.mide || 'cant',
             retirado: v('.obst-ret'), queda: v('.obst-queda'), pct: v('.obst-pct'), obs: v('.obst-obs') };
  });
}
function hayObstaculos(lista){
  return (lista || []).some(o => o && (o.retirado !== '' && o.retirado !== undefined || o.queda !== '' && o.queda !== undefined ||
                                       o.pct !== '' && o.pct !== undefined || (o.obs || '') !== ''));
}
// de: el número del informe del que vienen, cuando se traen de la visita anterior.
function ponerObstaculos(lista, de){
  (lista || []).forEach(o => {
    const f = document.querySelector('#panel-d .fila-obst[data-id="' + o.id + '"]');
    if (!f) return;
    const p = (c, val) => { const e = f.querySelector(c); if (e) e.value = (val === undefined || val === null) ? '' : val; };
    p('.obst-ret', o.retirado); p('.obst-queda', o.queda); p('.obst-pct', o.pct); p('.obst-obs', de ? '' : o.obs);
    obstResto(f);
  });
  const nota = document.getElementById('obst-de'), cont = document.getElementById('panel-d');
  if (nota && de && hayObstaculos(lista)){
    nota.hidden = false; nota.textContent = 'Cantidades traídas de ' + de + ': actualice lo que cambió desde entonces.';
    cont.dataset.heredado = de;
  }
}
