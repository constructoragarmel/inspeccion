    (aptos ? ' · ' + aptos + ' hallazgo(s)' : '') + (function(){ const k = (e.incidencias || []).filter(x => x.estado !== 'Cerrada').length; return k ? ' · ' + k + ' incidencia(s) sin cerrar' : ''; })() +
    '.<br>¿Arrancar desde lo que se registró ese día y marcar solo lo que cambió?</div>' +
    '<div class="b"><button type="button" class="si" onclick="traerHistorial()">Sí, traer lo anterior</button>' +
    '<button type="button" class="no" onclick="document.getElementById(\'aviso-historial\').innerHTML=\'\'">No, empezar en blanco</button></div></div>';
  // En una torre de dos convenios la propuesta caía debajo del aviso, fuera
  // de la pantalla: se decide antes de llenar, así que se trae a la vista.
  caja.firstElementChild.scrollIntoView({ block: 'center', behavior: 'smooth' });
}
function fechaLarga(f){
  if (!f) return '—';
  const [a, m, d] = f.split('-');
  const meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return parseInt(d, 10) + '-' + (meses[parseInt(m, 10) - 1] || m) + '-' + a;
}

// Trae respuestas, observaciones y apartamentos del último informe de la
// torre. NO trae fotografías —son de aquel día— ni la observación general.
// Todo lo traído queda marcado «visita anterior» hasta que alguien lo toque.
function traerHistorial(){
  const t = document.getElementById('torre').value;
  const e = estadosDeTorres()[t];
  document.getElementById('aviso-historial').innerHTML = '';
  if (!e) return;
  // En las cuatro torres con dos convenios, el que se registró la vez
  // anterior vale hoy: se elige solo y arrastra empresa y residente.
  const conv = document.getElementById('convenio');
  if (e.convenio && !conv.value && [...conv.options].some(o => o.value === e.convenio)){
    conv.value = e.convenio; alElegirConvenio();
  }
  // Veinte torres no traen residente en el maestro y el inspector lo escribe a
  // mano (T-03: «Harry Arteaga»). Lo escrito la vez anterior vale hoy si el
  // maestro no dice otra cosa. Igual la empresa.
  ['residente', 'empresa'].forEach(id => { const el = document.getElementById(id);
    if (e[id] && !el.value) el.value = e[id]; });
  (e.general || []).forEach(g => {
    const cont = document.getElementById('items-' + g.id); if (!cont) return;
    (g.items || []).forEach(it => {
      const el = buscarOCrearItem(g.id, it);
      if (!el) return;
      ponerSN(el, it.sn);
      el.querySelector('textarea').value = it.obs || '';
      if (it.sn || it.obs){ el.classList.add('heredado'); el.dataset.heredado = it.heredado || e.nro; }
    });
    const obs = document.querySelector('#srv-' + g.id + ' .obs-srv');
    if (obs && g.obs){ obs.value = g.obs; obs.dataset.heredado = e.nro; }
    if ((g.items || []).some(i => i.sn || i.obs) || g.obs) plegar(g.id, true);
  });
  (e.noInspeccionados || []).forEach(sid => { const b = document.getElementById('srv-' + sid);
    if (b && !b.classList.contains('no-inspeccionado')){ toggleNoInsp(sid); b.dataset.heredadoNI = '1'; } });
  (e.apartamentos || []).filter(a => !Object.keys(a.campos || {}).some(k => /estatus/i.test(k) && a.campos[k] === 'Corregido')).forEach(a => {
    addApartamento({ apto: a.apto, piso: a.piso, campos: a.campos, fotos: [] });
    const fila = document.querySelector('#filas-apto .fila-apto:last-child');
    fila.classList.add('heredado'); fila.dataset.heredado = a.heredado || e.nro;
  });
  (e.incidencias || []).filter(x => x.estado !== 'Cerrada').forEach(x => {
    addIncidencia(Object.assign({}, x, { fotos: [] }));
    const f = document.querySelector('#filas-inc .fila-inc:last-child');
    f.classList.add('heredado'); f.dataset.heredado = x.heredado || e.nro;
  });
  if (!hayObstaculos(leerObstaculos())) ponerObstaculos(e.obstaculos || [], e.nro);
  actualizarCuentas(); marcar();
}

// El ítem de un informe guardado, en la pantalla de hoy: por su nombre vigente
// entre los fijos; si no, entre los agregados que ya hay; si no, se crea. Así
// un agregado que Ingeniería pasó a fijo cae en el fijo y no sale dos veces.
function buscarOCrearItem(sid, it){
  const cont = document.getElementById('items-' + sid); if (!cont) return null;
  const nombre = nombreVigente(sid, it.nombre || '');
  const n = normalizar(nombre);
  const fijo = [...cont.querySelectorAll('.item[data-fijo="1"]')].find(f => normalizar(f.querySelector('.nombre').textContent) === n);
  if (fijo) return fijo;
  if (!nombre && !it.sn && !it.obs) return null;
  const libre = [...cont.querySelectorAll('.item[data-fijo="0"]')].find(f =>
    n && normalizar(f.querySelector('.nombre-libre').value) === n && !valorSN(f) && !f.querySelector('textarea').value);
  if (libre) return libre;
  return addItem(sid, nombre, false, !!(memoriaItems()[sid] || []).find(x => normalizar(x) === n));
}
function actualizarContador(){
  const n = listaGuardada().filter(x => !x.enviado).length;
  document.getElementById('cnt').textContent = n;
}
function abrirInformes(){
  const l = listaGuardada();
  const m = document.getElementById('modal-informes');
  const pend = l.filter(x => !x.enviado).length, env = l.length - pend;
  const porReenviar = l.filter(x => x.enviado && x.editadoTras).length, seVan = env - porReenviar;
  let html = '<div class="caja"><h2>Informes en este teléfono</h2>';
  if (!l.length) html += '<div class="vacio">No hay informes guardados aquí.</div>';
  else {
    html += '<p style="font-size:13px;color:#64748b;margin:0 0 10px">' + pend + ' sin enviar · ' + env + ' enviados' +
            (porReenviar ? ' (<b style="color:#8f4b00">' + porReenviar + ' cambiado(s) después: falta reenviar</b>)' : '') + '. ' +
            'Los que no se han enviado existen SOLO en este teléfono.</p>';
    if (pend) html += '<button type="button" class="btn-add" onclick="cerrarInformes();enviar()">📤 Enviar todos los pendientes (' + pend + ')</button>';
    if (seVan) html += '<button type="button" class="btn-add" style="border-color:#991b1b;color:#991b1b;background:#fee2e2" onclick="borrarEnviados()">🧹 ' + (seVan === 1 ? 'Borrar el que ya se envió' : 'Borrar los ' + seVan + ' que ya se enviaron') + '</button>';
    [...l].reverse().forEach(x => {
      html += '<div class="ficha"><div class="n">' + x.nro + '</div>' +
        '<div class="s">📍 ' + (x.torre || '—') + ' · 📅 ' + (x.fecha || '—') + ' · ' + (x.apartamentos || []).length + ' hallazgo(s)' + ((x.incidencias || []).length ? ' · ' + x.incidencias.length + ' incidencia(s)' : '') + '</div>' +
        '<div class="s" style="font-weight:700;color:' + (x.enviado ? '#166534' : '#a15c07') + '">' +
        (x.enviado ? '✅ Enviado ' + x.enviado + (x.editadoTras ? ' · ✏️ editado después (' + x.editadoTras + ')' : '') : '⏳ Sin enviar') + '</div>' +
        '<div class="b"><button type="button" onclick="cargarInforme(\'' + x.id + '\')">📂 Editar</button>' +
        (x.enviado ? '' : '<button type="button" onclick="vistaPrevia(\'' + x.id + '\')">👁 Ver</button>') +
        (x.enviado ? (x.editadoTras ? '<button type="button" class="env" onclick="enviarSolo(\'' + x.id + '\')">🔁 Reenviar</button>' : '')
                   : '<button type="button" class="env" onclick="enviarSolo(\'' + x.id + '\')">📤 Enviar</button>') +
        '<button type="button" class="del" onclick="borrarInforme(\'' + x.id + '\')">🗑️ Borrar</button></div></div>';
    });
  }
  html += '<button type="button" class="btn-add" style="margin-top:6px" onclick="cerrarInformes()">Cerrar</button></div>';
  m.innerHTML = html; m.hidden = false;
}
function cerrarInformes(){ document.getElementById('modal-informes').hidden = true; }

async function enviarSolo(id){
  cerrarInformes();
  const d = listaGuardada().find(x => x.id === id);
  if (!d) return;
  const falta = faltan(d);
  if (falta.length){ alert('A ' + d.nro + ' le falta ' + falta.join(', ') + '. Ábralo, complételo y vuelva a enviar.'); return; }
  if (!d.enviado && !confirmarSinRevisar([d])) return;
  let clave = ''; try { clave = localStorage.getItem('garmel_clave_envio') || ''; } catch(e){}
  if (!clave){ alert('⚠️ Este teléfono todavía no está configurado para enviar.'); return; }
  if (_tandaEnCurso){ alert('Ya hay un envío en curso. Espere a que termine.'); return; }
  _tandaEnCurso = true;
  if (!(await frenoSha())){ _tandaEnCurso = false; return; }
  try { cartel('📤 Enviando ' + d.nro + '…\n\nNo cierre esta pantalla ni vuelva a pulsar.');
        const r = await enviarUno(d, clave);
        alert(r.ok ? '✓ ' + d.nro + ' enviado. Quedó en Drive › Inspección › ' + _rutaDrive(d) + '.' : '✗ ' + d.nro + ': ' + explicar(r.error)); }
  finally { cartel(''); _tandaEnCurso = false; }
  actualizarContador();
}

function borrarInforme(id){
  const d = listaGuardada().find(x => x.id === id);
  if (!d) return;
  if (!confirm((d.enviado ? 'Este informe ya está en Drive. ' : '⚠️ Este informe NO se ha enviado: existe solo aquí. ') +
               '¿Borrarlo de este teléfono?')) return;
  localStorage.setItem(CLAVE_LISTA, JSON.stringify(listaGuardada().filter(x => x.id !== id)));
  FotosDB.borrar(id).catch(() => {});
  if (idActual === id) idActual = null;
  actualizarContador(); abrirInformes();
}

// Volver a poner en pantalla un informe guardado. El identificador se
// recalcula con lo cargado, y el id se conserva: editar no duplica.
function cargarInforme(id){
  const d = listaGuardada().find(x => x.id === id);
  if (!d) return;
  cerrarInformes();
  if (sucio && !confirm('Hay cambios sin guardar en pantalla. ¿Descartarlos y abrir ' + d.nro + '?')) return;
  _cargando = true;
  try {
    vaciarFormulario();
    idActual = d.id;
    const t = document.getElementById('torre'); t.value = d.torre || ''; alElegirTorre();
    if (d.convenio){ document.getElementById('convenio').value = d.convenio; alElegirConvenio(); }
    document.getElementById('empresa').value = d.empresa || '';
    document.getElementById('residente').value = d.residente || '';
    if (d.fecha) document.getElementById('fecha').value = d.fecha;
    document.getElementById('estatus').value = d.estatus || '';
    document.getElementById('accion').value = d.accion || '';
    document.getElementById('accion_det').value = d.accion_det || '';
    verRechazo();
    pintarFotos(document.getElementById('fotos-general'), (d.fotosGenerales || []).map(f => f.dato ? f : { pie: f.pie, dato: f.enDrive ? '' : '…' }));
    ponerObstaculos(d.obstaculos || []);
    pintarFotos(document.getElementById('fotos-obst'), (d.fotosObstaculos || []).map(f => f.dato ? f : { pie: f.pie, dato: f.enDrive ? '' : '…' }));
    (d.incidencias || []).forEach(x => { addIncidencia(x); if (x.heredado){ const f = document.querySelector('#filas-inc .fila-inc:last-child'); f.classList.add('heredado'); f.dataset.heredado = x.heredado; } });
    document.getElementById('obs_general').value = d.obs_general || '';
    if (document.getElementById('actividades')) document.getElementById('actividades').value = d.actividades || '';
    document.getElementById('inspectores').innerHTML = '';
    (d.inspectores && d.inspectores.length ? d.inspectores : ['']).forEach(i => addInspector(i));
    (d.general || []).forEach(g => {
      const cont = document.getElementById('items-' + g.id); if (!cont) return;
      (g.items || []).forEach(it => {
        // Por nombre vigente: un fijo renombrado sigue encontrándose, y un
        // agregado que después pasó a fijo cae en el fijo.
        const el = buscarOCrearItem(g.id, it);
        if (!el) return;
        ponerSN(el, it.sn);
        el.querySelector('textarea').value = it.obs || '';
        if (it.heredado){ el.classList.add('heredado'); el.dataset.heredado = it.heredado; }
      });
      document.querySelector('#srv-' + g.id + ' .obs-srv').value = g.obs || '';
      pintarFotos(document.getElementById('fotos-' + g.id), (g.fotos || []).map(f => f.dato ? f : { pie: f.pie, dato: f.enDrive ? '' : '…' }));
      // Lo que tiene algo se abre; lo vacío sigue plegado.
      if ((g.items || []).some(i => i.sn || i.obs || (i.agregado && i.nombre)) || g.obs || (g.fotos || []).length) plegar(g.id, true);
    });
    (d.noInspeccionados || []).forEach(sid => { const b = document.getElementById('srv-' + sid);
      if (b){ b.classList.add('no-inspeccionado'); b.querySelector('.no-insp').classList.add('on'); } });
    (d.apartamentos || []).forEach(a => {
      addApartamento(a);
      if (a.heredado){ const fila = document.querySelector('#filas-apto .fila-apto:last-child');
        fila.classList.add('heredado'); fila.dataset.heredado = a.heredado; }
    });
    pintarFotos(document.getElementById(GRID_MINUTAS), (d.fotosMinutas || []).map(f => f.dato ? f : { pie: f.pie, dato: f.enDrive ? '' : '…' }));
    try { localStorage.setItem(CLAVE_ACTUAL, d.id); } catch(e){}
    // Las imágenes llegan de IndexedDB un instante después; mientras, cada
    // foto se pinta con su pie y un «…». Un informe anterior a la v64 puede
    // traer `dato` dentro: se respeta.
    _fotosCargando = FotosDB.leer(d.id).catch(() => ({})).then(grupos => {
      if (idActual !== d.id) return;
      (d.general || []).forEach(g => {
        const datos = grupos[g.id] || [];
        pintarFotos(document.getElementById('fotos-' + g.id), (g.fotos || []).map((f, k) => ({ pie: f.pie, dato: f.dato || (f.enDrive ? '' : datos[k] || '') })));
      });
      const dmin = grupos['minutas'] || [];
      pintarFotos(document.getElementById(GRID_MINUTAS), (d.fotosMinutas || []).map((f, k) => ({ pie: f.pie, dato: f.dato || (f.enDrive ? '' : dmin[k] || '') })));
      [...document.querySelectorAll('#filas-apto .fila-apto')].forEach((fila, i) => {
        const a = (d.apartamentos || [])[i]; if (!a) return;
        const datos = grupos['apto:' + i] || [];
        pintarFotos(fila.querySelector('.fotos'), (a.fotos || []).map((f, k) => ({ pie: f.pie, dato: f.dato || (f.enDrive ? '' : datos[k] || '') })));
      });
      const dg = grupos['general'] || [];
      pintarFotos(document.getElementById('fotos-general'), (d.fotosGenerales || []).map((f, k) => ({ pie: f.pie, dato: f.dato || (f.enDrive ? '' : dg[k] || '') })));
      const dob = grupos['obst'] || [];
      pintarFotos(document.getElementById('fotos-obst'), (d.fotosObstaculos || []).map((f, k) => ({ pie: f.pie, dato: f.dato || (f.enDrive ? '' : dob[k] || '') })));
      [...document.querySelectorAll('#filas-inc .fila-inc')].forEach((f, i) => { const x = (d.incidencias || [])[i]; if (!x) return; const dx = grupos['inc:' + i] || [];
        pintarFotos(f.querySelector('.fotos'), (x.fotos || []).map((ft, k) => ({ pie: ft.pie, dato: ft.dato || (ft.enDrive ? '' : dx[k] || '') }))); });
    });
  } finally {
    _cargando = false;
    // Si la carga revienta a medias, el autoguardado NO debe pisar el informe
    // guardado con la mitad de lo que alcanzó a pintarse (pasó el 21-sep en el
    // banco: una constante fuera de sitio dejó un informe sin inspector ni
    // incidencias). Lo que hay en pantalla no se guarda hasta que alguien lo toque.
    clearTimeout(temporizador); sucio = false;
  }
  actualizarNro(); actualizarCuentas(); sucio = false;
  window.scrollTo(0, 0);
}

function vaciarFormulario(){
  ['empresa','residente','obs_general','accion','accion_det'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fotos-general').innerHTML = '';
  if (document.getElementById('actividades')) document.getElementById('actividades').value = '';
  document.getElementById('torre').value = ''; alElegirTorre();
  document.getElementById('estatus').value = ''; verRechazo();
  document.getElementById('inspectores').innerHTML = ''; addInspector();
  pintarGeneral(); pintarApartamentos(); pintarIncidencias(); pintarObstaculos();
  document.getElementById(GRID_MINUTAS).innerHTML = '';
  const hoy = new Date();
  document.getElementById('fecha').value = hoy.getFullYear() + '-' + String(hoy.getMonth()+1).padStart(2,'0') + '-' + String(hoy.getDate()).padStart(2,'0');
  idActual = null; sucio = false; actualizarNro(); actualizarCuentas();
  try { localStorage.removeItem(CLAVE_ACTUAL); } catch(e){}
}

// Al abrir, el informe que estaba en pantalla vuelve a estar en pantalla —si
// no se envió—. Antes se abría siempre en blanco: un teléfono que descarga la
// pestaña mientras se atiende una llamada devolvía un formulario vacío, y lo
// escrito solo estaba detrás de «Informes», donde nadie lo buscaba.
function reabrirActual(){
  let id = null;
  try { id = localStorage.getItem(CLAVE_ACTUAL); } catch(e){}
  if (!id) return false;
  const d = listaGuardada().find(x => x.id === id);
  if (!d || d.enviado) return false;
  cargarInforme(id);
  return true;
}

// «Nuevo» deja el formulario en blanco. Lo que había en pantalla se guarda
// antes si tenía algo: los informes guardados no se tocan.
// El grano es la torre y un día son varias: se guarda esta y se prepara la
// siguiente conservando lo que no cambia —inspector, fecha, estatus— y
// vaciando lo que la torre decide y lo medido. Un informe a medias no sale:
// si falta cabecera, se dice y no se cambia de torre.
function siguienteTorre(){
  const d = datosDelFormulario();
  const f = faltan(d);
  if (f.length){ alert('A este informe le falta ' + f.join(', ') + '. Complételo antes de pasar a otra torre.'); return; }
  if (!guardar(false)) return;   // si no se pudo guardar, NO se limpia
  const insp = inspectoresElegidos(), fecha = d.fecha, estatus = d.estatus;
  vaciarFormulario();
  document.getElementById('fecha').value = fecha;
  document.getElementById('inspectores').innerHTML = '';
  (insp.length ? insp : ['']).forEach(i => addInspector(i));
  actualizarNro(); sucio = false;
  window.scrollTo(0, 0);
  document.getElementById('torre').focus();
}

function nuevoInforme(){
  if (sucio && !confirm('¿Guardar lo que hay en pantalla y empezar un informe nuevo?')) return;
  if (sucio) guardar(false);
  vaciarFormulario();
}

// El remedio cuando el teléfono se llena: lo enviado está a salvo en Drive.
// Un informe enviado y CAMBIADO DESPUÉS no se borra: la corrección vive solo en este teléfono hasta que se reenvía.
// Antes se iba con los demás y la oficina se quedaba con la versión vieja sin que nadie lo notara; y el botón borraba
// sin preguntar, cuando el de inspección sí pregunta (Planificación, 5-oct-2026).
const _yaEstaEnLaOficina = x => !!(x && x.enviado && !x.editadoTras);
function borrarEnviados(){
  const todos = listaGuardada();
  const seVan = todos.filter(_yaEstaEnLaOficina);
  const porReenviar = todos.filter(x => x.enviado && x.editadoTras).length;
  if (!seVan.length){ alert('No hay informes enviados que borrar.' + (porReenviar ? ' Hay ' + porReenviar + ' que cambió después de enviarlo: reenvíelo primero.' : '')); return; }
  if (!confirm('Se van a borrar de este teléfono ' + seVan.length + ' informe(s) YA ENVIADOS.\n\n' +
               'Siguen guardados en la oficina: esto solo libera espacio aquí.\n\n' +
               'Los que todavía no se han enviado NO se tocan.' +
               (porReenviar ? '\n\nTampoco se toca(n) ' + porReenviar + ' que cambió después de enviarlo(s): reenvíelo(s) primero.' : ''))) return;
  const quedan = todos.filter(x => !_yaEstaEnLaOficina(x));
  localStorage.setItem(CLAVE_LISTA, JSON.stringify(quedan));
  FotosDB.borrarVarios(seVan.map(x => x.id)).catch(() => {});
  actualizarContador();
  alert('Listo. Quedan ' + quedan.length + ' informe(s) en este teléfono' + (porReenviar ? ', ' + porReenviar + ' por reenviar.' : '.'));
  abrirInformes();
}

// ⚠️ AVISAR ANTES DE QUE FALLE, no cuando ya falló. En el otro formulario el
// aviso de poco espacio no llegaba nunca a verse en obra: para cuando saltaba,
// el guardado ya había reventado. Aquí se mira en cada guardado, y como este
// informe puede llevar 36 fotografías, se llena antes.
function vigilarEspacio(){
  // Con las fotos en IndexedDB, lo que manda es la cuota real del navegador
  // (`storage.estimate`), que en un teléfono son cientos de MB. localStorage,
  // que solo lleva texto, se vigila igual contra su tope de 5 MB.
  if (navigator.storage && navigator.storage.estimate){
    navigator.storage.estimate().then(e => { if (e.quota) avisarEspacio(e.usage || 0, e.quota); }).catch(() => {});
  }
  let bytes = 0;
  try { for (const k in localStorage) if (Object.hasOwn(localStorage, k))
          bytes += (localStorage[k] || '').length * 2; } catch(e){ return; }
  avisarEspacio(bytes, 5242880);
}
function avisarEspacio(bytes, tope){
  // Se guarda a los 2 s de cada tecla: sin este freno el aviso saltaba en
  // cada guardado, tecla tras tecla. Se avisa al pasar cada tramo del 10 %.
  const tramo = Math.floor(bytes / tope * 10);
  if (bytes > tope * 0.8 && tramo > _tramoAvisado){
    _tramoAvisado = tramo;
    const pct = Math.round(bytes / tope * 100);
    alert('⚠️ Este teléfono va por el ' + pct + '% de su espacio.\n\n' +
          'Envíe los informes pendientes y use «Mis informes» para borrar los ' +
          'que ya se enviaron, antes de que deje de guardar.');
  }
}
let _tramoAvisado = 0;

// ── Envío al relevo ───────────────────────────────────────────────────────
// Mismo contrato que el formulario de inspección, con una etiqueta más:
// `tipo: 'servicios'`. El relevo archiva datos y fotografías, anota la fila en
// el registro y se detiene ahí —sin PDF ni Smartsheet, que todavía no existen
// para servicios—. Lo que llega a Drive es lo que después se puede rehacer.
let _tandaEnCurso = false;

function faltan(d){
  const f = [];
  if (!d.torre)    f.push('la torre');
  if (!d.convenio) f.push('el convenio');
  if (!d.fecha)    f.push('la fecha');
  if (!d.inspectores.length) f.push('el inspector');
  if (!d.estatus) f.push('el estatus general del cierre');
  if (d.estatus === 'Rechazado' && !d.accion) f.push('la acción por el rechazo');
  (d.incidencias || []).forEach((x, i) => { if (!x.tipo) f.push('el tipo de accidente de la incidencia ' + (i + 1)); });
  return f;
}

// Las fotografías viajan aparte, con nombre, para poder consultarlas fuera del
// informe. En los datos queda solo su pie, que es texto.
function sobreDe(d, clave, grupos){
  const fotos = [];
  const datos = JSON.parse(JSON.stringify(d));
  grupos = grupos || {};
  const soltar = (lista, prefijo, imgs) => (lista || []).map((f, k) => {
    const dato = f.dato || (imgs || [])[k] || '';
    if (dato) fotos.push({ nombre: prefijo + '-' + (k + 1), dato });
    return { pie: f.pie || '' };
  });
  datos.general.forEach(srv => { srv.fotos = soltar(srv.fotos, srv.id, grupos[srv.id]); });
  datos.apartamentos.forEach((a, i) => { a.fotos = soltar(a.fotos, 'apto-' + (i + 1) + '-' + limpiar(a.apto || ''), grupos['apto:' + i]); });
  datos.fotosGenerales = soltar(datos.fotosGenerales, 'general', grupos['general']);
  (datos.incidencias || []).forEach((x, i) => { x.fotos = soltar(x.fotos, 'inc-' + (i + 1), grupos['inc:' + i]); });
  datos.fotosObstaculos = soltar(datos.fotosObstaculos, 'obst', grupos['obst']);
  datos.fotosMinutas = soltar(datos.fotosMinutas, 'minutas', grupos['minutas']);   // viajan como minutas-1, minutas-2…
  delete datos.fotosDB;
  // El registro del relevo lee `estatus` y `residentes` como LISTAS —les hace
  // .join()— porque así viajan desde inspección. Un texto suelto reventaría
  // dentro de anotarEnRegistro y el relevo contestaría ok:false a todos.
  datos.estatus    = d.estatus   ? [d.estatus]   : [];
  datos.residentes = d.residente ? [d.residente] : [];
  return { clave, numero: d.nro, tipo: 'sha', ambito: 'torre',
           sector: SECTOR_POR_CONVENIO[d.convenio] || 'XX', torre: d.torre,
           datos, fotos };
}

// El cartel tapa la pantalla mientras dura la tanda: un aviso que se desvanece
// a los dos segundos hacía que el inspector volviera a pulsar y mandara todo
// dos veces.
function cartel(texto){
  let c = document.getElementById('cartel-envio');
  if (!texto){ if (c) c.remove(); return; }
  if (!c){
    c = document.createElement('div'); c.id = 'cartel-envio';
    c.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(17,24,39,.88);' +
      'display:flex;align-items:center;justify-content:center;text-align:center;' +
      'padding:24px;color:#fff;font-size:17px;font-weight:700;line-height:1.5;white-space:pre-line';
    document.body.appendChild(c);
  }
  c.textContent = texto;
}

async function enviarUno(d, clave){
  // Con señal mala el envío se quedaba colgado sin decir nada; a los 90 s se
  // corta solo y el informe sigue guardado para reintentarlo.
  const corte = new AbortController();
  const reloj = setTimeout(() => corte.abort(), 90000);
  try {
    // Las fotos se leen de IndexedDB después de que termine cualquier
    // escritura en curso: lo que viaja es lo último que se guardó.
    await _escrituraFotos.catch(() => {});
    const grupos = await FotosDB.leer(d.id).catch(() => ({}));
    const r = await fetch(RELEVO_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(sobreDe(d, clave, grupos)),
      signal: corte.signal
    });
    const res = await r.json();
    if (res.ok){ marcarEnviado(d.id, d.nro); return { ok: true }; }
    return await rescatar(d, clave, res.error || 'Error desconocido');
  } catch (e) {
    return await rescatar(d, clave, (e && e.name === 'AbortError') ? 'Sin respuesta en 90 segundos' : String(e));
  } finally { clearTimeout(reloj); }
}

// Antes de dar un envío por fallido se le pregunta al relevo si ese informe ya
// quedó archivado. El 17-sep-2026 el relevo archivó SHA-EZ-T16 dos veces y el
// teléfono, que no recibió la respuesta, lo seguía mostrando como no enviado.
// Se confirma por número Y por hora de guardado: el mismo número de un envío
// anterior no cuenta. Si no se puede confirmar, el fallo se informa como antes.
async function rescatar(d, clave, error){
  const fallo = { ok: false, error };
  if (/clave|faltan|sector/i.test(error) || !navigator.onLine) return fallo;
  const sec = SECTOR_POR_CONVENIO[d.convenio];
  if (!sec || !d.torre || !d.guardado) return fallo;
  const corte = new AbortController(); const reloj = setTimeout(() => corte.abort(), 20000);
  try {
    const r = await fetch(RELEVO_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ clave, accion: 'historial', tipo: TIPO_INFORME, sector: sec, torre: d.torre }), signal: corte.signal });
    const j = await r.json();
    const e = j && j.informe;
    if (j.ok && e && e.nro === d.nro && e.guardado === d.guardado){
      console.warn(d.nro, 'sí quedó archivado aunque la respuesta no llegó:', error);
      marcarEnviado(d.id, d.nro);
      return { ok: true, rescatado: true };
    }
  } catch (e2) {
  } finally { clearTimeout(reloj); }
  return fallo;
}

function marcarEnviado(id, nro){
  try {
    const l = listaGuardada();
    const x = l.find(y => y.id === id);
    if (x){
      x.enviado = new Date().toLocaleString();
      delete x.editadoTras;
      // Las fotografías ya están en Drive: aquí solo ocupaban sitio. Se quedan
      // el pie y la marca. Con fotos de ~300 KB, dos informes llenaban el
      // teléfono aunque ya estuvieran enviados.
      const soltar = f => ({ pie: f.pie || '', enDrive: true });
      (x.general || []).forEach(g => { g.fotos = (g.fotos || []).map(soltar); });
      (x.apartamentos || []).forEach(a => { a.fotos = (a.fotos || []).map(soltar); });
      x.fotosGenerales = (x.fotosGenerales || []).map(soltar);
      (x.incidencias || []).forEach(k => { k.fotos = (k.fotos || []).map(soltar); });
      x.fotosObstaculos = (x.fotosObstaculos || []).map(soltar);
      x.fotosMinutas = (x.fotosMinutas || []).map(soltar);
      FotosDB.borrar(id).catch(() => {});
      // Si es el que está en pantalla, sus fotos en el grid pasan a «ya en
      // Drive» en el próximo guardado; hasta entonces se siguen viendo.
    }
    localStorage.setItem(CLAVE_LISTA, JSON.stringify(l));
    actualizarContador();
  } catch (e) {
    // Se envió bien pero no se pudo anotar. Si esto pasa callado, la próxima
    // tanda lo manda otra vez y aparece duplicado en Drive.
    alert('⚠️ ' + nro + ' SÍ se envió, pero no se pudo marcar como enviado en este ' +
          'teléfono. No lo vuelva a enviar: ya está en Drive.');
  }
}

// Lo que vino de la visita anterior y nadie tocó hoy se dice ANTES de enviar.
// Un informe que sale todo heredado sin que nadie lo sepa es un documento que
// afirma cosas que hoy no se miraron.
function cuentaSinRevisar(d){
  let n = 0;
  (d.general || []).forEach(g => (g.items || []).forEach(i => { if (i.heredado && i.sn) n++; }));
  (d.apartamentos || []).forEach(a => { if (a.heredado) n++; });
  (d.incidencias || []).forEach(x => { if (x.heredado) n++; });
  return n;
}
function confirmarSinRevisar(lista){
  const con = lista.map(d => ({ nro: d.nro, n: cuentaSinRevisar(d) })).filter(x => x.n);
  if (!con.length) return true;
  return confirm('⚠️ Hay respuestas de la visita anterior que nadie revisó hoy:\n\n' +
    con.map(x => x.nro + ': ' + x.n).join('\n') +
    '\n\nSe envían tal cual, marcadas como heredadas.\nACEPTAR: enviar igual. CANCELAR: volver a revisarlas.');
}

// Al inspector se le dice qué hacer, no qué falló por dentro. El detalle
// técnico queda en la consola, que es donde sirve para diagnosticar.
// v131 (6-oct-2026): al enviar, decir en qué carpeta de Drive quedó el informe. Mismo árbol que arma el relevo:
// Inspección › sector › Torres › torre › Servicios|SHA, y urbanismo en Inspección › sector › Urbanismo › manzana.
function _rutaDrive(d){
  const sec = (typeof _ZONA_NOMBRE !== 'undefined' && _ZONA_NOMBRE[d.convenio]) || 'sector';
  if (d.tipo === 'urbanismo') return [sec, 'Urbanismo', d.torre || 'manzana'].join(' › ');
  return [sec, 'Torres', d.torre || 'torre', ({ servicios: 'Servicios', sha: 'SHA' })[d.tipo] || 'Informe'].join(' › ');
}
function explicar(err){
  if (/clave/i.test(err))  return 'La clave de este teléfono no es válida. Abra otra vez el enlace de configuración.';
  if (/sector/i.test(err)) return 'El informe no tiene convenio, y sin convenio no sabe a qué sector va.';
  if (/faltan/i.test(err)) return 'Al informe le faltan datos de cabecera: ' + err;
  if (/90 segundos/.test(err)) return 'No hubo respuesta. Con señal, vuelva a pulsar Enviar.';
  if (/Failed to fetch|NetworkError|Load failed/i.test(err)) return 'No hay señal, o el relevo no responde. Con señal, vuelva a pulsar Enviar.';
  // Con un detalle corto: sin él, el 17-sep no hubo forma de saber por qué la
  // respuesta del relevo no llegó al teléfono.
  return 'El relevo no pudo archivarlo. El informe sigue guardado aquí: reinténtelo, y si vuelve a fallar avise a la oficina.' +
         '\n(detalle: ' + String(err).replace(/\s+/g, ' ').slice(0, 90) + ')';
}

// El bloque de acción solo existe cuando el cierre es «Rechazado» (Birmania, 16-sep).
function verRechazo(){
  const r = document.getElementById('rechazo'); if (!r) return;
  r.hidden = document.getElementById('estatus').value !== 'Rechazado';
  if (r.hidden){ document.getElementById('accion').value = ''; document.getElementById('accion_det').value = ''; }
}

async function relevoAceptaSha(){
  try {
    const corte = new AbortController(); const reloj = setTimeout(() => corte.abort(), 15000);
    const r = await fetch(RELEVO_URL, { signal: corte.signal }); clearTimeout(reloj);
    const j = await r.json();
    return { ok: (j.tipos || []).indexOf('sha') >= 0, version: j.version || '?' };
  } catch (e) { return { ok: false, error: String(e) }; }
}
async function frenoSha(){
  const a = await relevoAceptaSha();
  if (a.ok) return true;
  alert(a.error
    ? 'No hay señal, o el relevo no responde. El informe sigue guardado aquí.'
    : '⏸ El relevo (' + a.version + ') todavía no recibe informes de SHA.\n\n' +
      'El informe queda guardado en este teléfono y se enviará cuando la oficina lo active. No hay que hacer nada más.');
  return false;
}

async function enviar(){
  if (_tandaEnCurso){ alert('Ya hay un envío en curso. Espere a que termine.'); return; }
  let clave = '';
  try { clave = localStorage.getItem('garmel_clave_envio') || ''; } catch(e){}
  if (!clave){
    alert('⚠️ Este teléfono todavía no está configurado para enviar.\n\n' +
          'Abra el enlace de configuración que le enviaron. El informe queda guardado aquí.');
    return;
  }
  // Lo que está en pantalla se guarda primero: se envía lo guardado, no lo que
  // se ve, y así lo que viaja es exactamente lo que queda en el teléfono.
  const actual = datosDelFormulario();
  const f = faltan(actual);
  if (f.length && (actual.torre || actual.apartamentos.length || actual.general.some(g => g.items.some(i => i.sn || i.obs)))){
    alert('A este informe le falta ' + f.join(', ') + '. Complételo antes de enviar.');
    return;
  }
  if (!f.length) guardar(false);

  const pendientes = listaGuardada().filter(x => !x.enviado && !faltan(x).length);
  if (!pendientes.length){
    // «Informes» cuenta como pendiente todo lo no enviado, también lo que está a
    // medias; decir aquí «no hay pendientes» con ocho en la lista confundía
    // (QC de SHA del 17-sep). Se dice cuáles y qué les falta.
    const aMedias = listaGuardada().filter(x => !x.enviado && faltan(x).length);
    alert(aMedias.length
      ? 'No hay informes listos para enviar. Hay ' + aMedias.length + ' guardado(s) a medias:\n\n' +
        aMedias.slice(0, 5).map(x => x.nro + ': falta ' + faltan(x).join(', ')).join('\n') +
        (aMedias.length > 5 ? '\n…' : '') + '\n\nÁbralos desde Informes y complételos, o bórrelos.'
      : 'No hay informes pendientes de enviar.');
    return;
  }
  if (!confirmarSinRevisar(pendientes)) return;

  _tandaEnCurso = true;
  if (!(await frenoSha())){ _tandaEnCurso = false; return; }
  let bien = 0; const fallos = [];
  try {
    for (const d of pendientes){
      cartel('📤 Enviando ' + (bien + fallos.length + 1) + ' de ' + pendientes.length + '…\n\n' +
             'No cierre esta pantalla ni vuelva a pulsar Enviar.');
      const r = await enviarUno(d, clave);
      if (r.ok) bien++; else { fallos.push(d.nro + ': ' + explicar(r.error)); console.error(d.nro, r.error); }
    }
  } finally { cartel(''); _tandaEnCurso = false; }

  actualizarContador();
  alert((bien ? '✓ ' + bien + ' informe(s) enviado(s) a Drive.\n\n' : '') +
        (fallos.length ? '✗ ' + fallos.length + ' sin enviar — siguen guardados aquí:\n\n' + fallos.join('\n\n') : ''));
}

// ── Vista previa del informe (v115, 2-oct-2026) ─────────────────────────────
// Pedido de un inspector de urbanismo: ver el PDF antes de enviarlo, para
// verificarlo. La plantilla es LA MISMA que usa el relevo para el PDF oficial
// (vista-previa.js se genera desde su PDF.gs: no hay una segunda plantilla que
// pueda quedarse atrás). Se arma en el teléfono con el mismo sobre que viajaría,
// sin señal y sin enviar nada. El archivo se carga la primera vez que se pide.
const VP_ANCHO = 794;            // una hoja A4 a 96 puntos por pulgada
let _vpCarga = null;
function _vpCargar(){
  if (window.VistaPrevia) return Promise.resolve();
  if (!_vpCarga) _vpCarga = new Promise((bien, mal) => {
    const s = document.createElement('script');
    s.src = 'vista-previa.js';
    s.onload = () => window.VistaPrevia ? bien() : mal(new Error('vista-previa.js no trajo la plantilla'));
    s.onerror = () => { _vpCarga = null; s.remove(); mal(new Error('vista-previa.js no cargó')); };
    document.head.appendChild(s);
  });
  return _vpCarga;
}

// Sin `id`: lo que está en pantalla, guardado o no. Con `id`: un informe guardado.
async function vistaPrevia(id){
  const mas = document.getElementById('fila-mas'); if (mas) mas.hidden = true;
  let d, grupos;
  if (id){
    cerrarInformes();
    d = listaGuardada().find(x => x.id === id);
    if (!d) return;
    await _escrituraFotos.catch(() => {});
    grupos = await FotosDB.leer(id).catch(() => ({}));
  } else {
    d = datosDelFormulario();
    if (informeVacio(d)){ alert('Todavía no hay nada que mostrar: el informe está en blanco.'); return; }
    grupos = d.fotosDB || {};
  }
  try { await _vpCargar(); }
  catch (e) { alert('No se pudo abrir la vista previa. Con señal, vuelva a intentarlo.'); console.error(e); return; }
  let html;
  try { html = VistaPrevia.html(sobreDe(d, '', grupos)); }
  catch (e) { alert('No se pudo armar la vista previa de este informe. El informe no se ha tocado.'); console.error(e); return; }
  _vpMostrar(html, d.nro || '', faltan(d));
}

function _vpMostrar(html, nro, falta){
  _vpCerrar();
  const v = document.createElement('div');
  v.id = 'vista-previa';
  v.innerHTML =
    '<div class="vp-cab"><div class="t">Vista previa<small>Así saldrá el PDF. Todavía NO se ha enviado.</small></div>' +
      '<button type="button" class="vp-zoom" onclick="_vpZoom()" aria-label="Ver la hoja a tamaño real">🔍 Ampliar</button>' +
      '<button type="button" onclick="_vpCerrar()">✕ Cerrar</button></div>' +
    (falta.length ? '<div class="vp-aviso">A este informe le falta ' + falta.join(', ') + '. Complételo antes de enviar.</div>' : '') +
    '<div class="vp-cuerpo"><div class="vp-hoja"><iframe scrolling="no"></iframe></div></div>';
  document.body.appendChild(v);
  const marco = v.querySelector('iframe'), hoja = v.querySelector('.vp-hoja'), cuerpo = v.querySelector('.vp-cuerpo');
  marco.title = 'Vista previa del informe ' + nro;
  // La hoja se dibuja a su ancho real y se achica entera hasta caber: así se ve
  // la página como va a quedar, no una versión reacomodada para el teléfono.
  const ajustar = () => {
    const doc = marco.contentDocument;
    if (!doc || !doc.body) return;
    // Ajustada: la hoja entera a lo ancho. Ampliada: a tamaño real, y se recorre con el dedo.
    const cabe = Math.min(1, (cuerpo.clientWidth - 16) / VP_ANCHO);
    const e = v.dataset.zoom ? 1 : cabe;
    const bz = v.querySelector('.vp-zoom');
    bz.hidden = cabe > 0.95;
    bz.textContent = v.dataset.zoom ? '↔ Ajustar' : '🔍 Ampliar';
    marco.style.height = '10px';
    const alto = Math.max(doc.body.scrollHeight, doc.documentElement.scrollHeight) + 8;
    marco.style.height = alto + 'px';
    marco.style.transform = 'scale(' + e + ')';
    hoja.style.width = Math.round(VP_ANCHO * e) + 'px';
    hoja.style.height = Math.round(alto * e) + 'px';
  };
  v._ajustar = ajustar;
  addEventListener('resize', ajustar);
  // Los márgenes de la hoja los pone Google al convertir; aquí se imitan. Se
  // escribe en el marco en vez de usar `srcdoc`, a propósito: la plantilla no
  // lleva «doctype», y así el navegador la dibuja en el mismo modo que el
  // conversor de Google (con `srcdoc` las tablas salían con la letra a la mitad
  // de lo que sale en el PDF).
  const doc = marco.contentDocument;
  doc.open();
  doc.write(html.replace('<head>', '<head><style>body{margin:38px 56px}</style>'));
  doc.close();
  [...doc.images].forEach(im => im.addEventListener('load', ajustar));
  ajustar(); setTimeout(ajustar, 400);
}
function _vpZoom(){
  const v = document.getElementById('vista-previa');
  if (!v) return;
  if (v.dataset.zoom) delete v.dataset.zoom; else v.dataset.zoom = '1';
  // Dos pasadas: en escritorio, al volver de «Ampliar» las barras de desplazamiento
  // todavía ocupan sitio en la primera, y la hoja quedaba 15 px más angosta.
  v._ajustar(); v._ajustar();
  v.querySelector('.vp-cuerpo').scrollTo(0, 0);
}
function _vpCerrar(){
  const v = document.getElementById('vista-previa');
  if (!v) return;
  removeEventListener('resize', v._ajustar);
  v.remove();
}

// ── No perder lo escrito ──────────────────────────────────────────────────
// Cerrar la pestaña con cambios sin guardar pregunta antes. Y al irse a otra
// aplicación —una llamada, la cámara del sistema— se guarda en el acto: en un
// teléfono, «después» puede ser que el navegador descargue la pestaña.
addEventListener('beforeunload', e => { if (sucio){ e.preventDefault(); e.returnValue = ''; } });
document.addEventListener('visibilitychange', () => { if (document.hidden && sucio) guardar(false); });

// ── Sin señal: la copia local y el aviso de versión nueva ─────────────────
// ── ¿Dónde es? Una torre, varias, o toda una zona (PA-112, 30-sep-2026) ──
// Pedido de los inspectores de urbanismo, servicios y SHA (Skarlet Gómez, vía
// Stephanie): hay incidencias que pasan entre dos manzanas, entre dos torres o en
// todo un urbanismo, y hoy obligan a hacer tres o cuatro informes de lo mismo.
// Sigue siendo UN informe:
//  · «Varias»: la torre (o manzana) del desplegable es la PRINCIPAL —ahí se
//    archiva— y las demás quedan como «también afecta a»,
//    en el informe, en el PDF y en Smartsheet (columna «Ubicación»). El número
//    lleva cuántas más: SRV-EZ-T07+2-260930-HE, para no pisar el informe de la
//    T-07 sola del mismo día.
//  · «Toda la zona»: el lugar es ZONA y el relevo lo archiva en la carpeta
//    «General» de la zona; la zona se elige donde va el convenio (cada convenio es
//    una zona). Si también toca otras zonas, se agregan.
// Skarlet Gómez, 30-sep: «los tres urbanismos» son las tres zonas, y lo que está
// entre dos contratistas «se debería asignar a ambas»: en «Varias», empresa y
// residente llevan los de todas las torres (o manzanas), separados por « · ».
const _LUGAR = /manzana/i.test((document.querySelector('label[for="torre"]') || {}).textContent || '') ? 'manzana' : 'torre';
const _TXT_DONDE = _LUGAR === 'manzana'
  ? { una: 'Una manzana o lote', varias: 'Varias manzanas', otra: '＋ Agregar otra manzana o lote', plural: 'manzanas' }
  : { una: 'Una torre', varias: 'Varias torres', otra: '＋ Agregar otra torre', plural: 'torres' };
const _ZONA_NOMBRE = { 'Convenio Bielorrusos': 'Ezequiel Zamora', 'Convenio Rusos': 'Simón Rodríguez', 'Convenio Chinos': 'Simón Bolívar' };
let _modoDonde = 'una', _otras = [];
let _propios = { empresa: '', residente: '' };   // los de la principal, como los dejó la cascada
let _etiquetaConvenio = (document.querySelector('label[for="convenio"]') || {}).textContent || 'Convenio';
// ── Primero el sector (Diego Orta, 30-sep-2026) ──
// «Que la caída sea sector, torre y de ahí para abajo», con el nombre del sector y no
// el del convenio. Elegido el sector, la lista de torres queda solo con las suyas: la
// T-04, la T-07, la T-12 y la T-13 existen en dos sectores, y así ya no se mezclan
// (el 30-sep un informe de SHA de la T-13 sumó la empresa de la T-13 del otro sector).
// Urbanismo ya elegía primero el sector: allí no se toca.
const _SECTOR_PRIMERO = (typeof llenarManzanas !== 'function');
let _sectorElegido = '';
// En «Toda la zona» no hay torre que llene empresa y residente: el rótulo lo dice.
const _placeholders = { empresa: (document.getElementById('empresa') || {}).placeholder || '',
                        residente: (document.getElementById('residente') || {}).placeholder || '' };

(function(){
  const st = document.createElement('style');
  st.textContent =
    '.donde{display:flex;gap:6px;flex-wrap:wrap}' +
    '.donde button{flex:1 1 30%;min-height:44px;border:2px solid var(--azul);background:#fff;color:var(--azul);' +
    'border-radius:10px;font-weight:700;font-size:13px;padding:6px 8px;cursor:pointer}' +
    '.donde button.on{background:var(--azul);color:#fff}' +
    '.donde-ayuda{font-size:12px;color:#475569;margin-top:6px}' +
    '#otras-lista{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}' +
    '.otra{display:inline-flex;align-items:center;gap:2px;background:var(--azul-cl);color:var(--azul);border-radius:16px;' +
    'padding:2px 2px 2px 12px;font-weight:700;font-size:13px}' +
    '.otra button{min-width:40px;min-height:40px;border:0;background:transparent;color:var(--azul);font-size:16px;cursor:pointer}' +
    '.otras-empresas{font-size:12px;color:#8f4b00;margin-top:6px}';
  document.head.appendChild(st);
  const torre = document.getElementById('torre');
  const rej = torre.closest('.rejilla') || torre.closest('.campo').parentElement;
  const caja = document.createElement('div');
  caja.className = 'campo'; caja.id = 'campo-donde'; caja.style.gridColumn = '1 / -1';
  caja.innerHTML = '<label>¿Dónde es?</label><div class="donde" role="radiogroup" aria-label="¿Dónde es?">' +
    [['una', _TXT_DONDE.una], ['varias', _TXT_DONDE.varias], ['zona', 'Toda la zona']].map(function(x){
      return '<button type="button" role="radio" data-m="' + x[0] + '">' + x[1] + '</button>'; }).join('') +
    '</div><div class="donde-ayuda" id="donde-ayuda"></div>';
  rej.insertBefore(caja, rej.firstChild);
  if (_SECTOR_PRIMERO) {
    const cc = document.getElementById('convenio').closest('.campo');
    torre.closest('.campo').before(cc);
    const lc = document.querySelector('label[for="convenio"]'); if (lc) lc.textContent = 'Sector';
    _etiquetaConvenio = 'Sector';
    _opcionesSector();
  }
  caja.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ ponerModoDonde(b.dataset.m); }; });
  const otras = document.createElement('div');
  otras.className = 'campo'; otras.id = 'campo-otras'; otras.hidden = true; otras.style.gridColumn = '1 / -1';
  otras.innerHTML = '<label for="otra-lugar">También afecta a</label><div id="otras-lista"></div>' +
    '<select id="otra-lugar"></select><div class="otras-empresas" id="otras-empresas"></div>';
  torre.closest('.campo').after(otras);
  document.getElementById('otra-lugar').onchange = function(){
    const v = this.value; this.value = '';
    if (v && _otras.indexOf(v) < 0) { _otras.push(v); _alCambiarOtras(); }
  };
})();

function _asegurarOpcionZona(){
  const sel = document.getElementById('torre');
  if (![...sel.options].some(function(o){ return o.value === 'ZONA'; })) {
    const o = document.createElement('option'); o.value = 'ZONA'; o.textContent = '🌐 Toda la zona'; sel.appendChild(o);
  }
}
function _nombreZona(c){ return _ZONA_NOMBRE[c] || c || ''; }
function _entradasDelSector(t){
  const c = _sectorElegido || document.getElementById('convenio').value;
  const todas = entradasDe(t) || [];
  const del = todas.filter(function(x){ return x.c === c; });
  return (c && del.length) ? del : todas;
}
function _opcionesSector(){
  if (!_SECTOR_PRIMERO) return;
  const conv = document.getElementById('convenio');
  const v = _sectorElegido || conv.value;
  // QC de UX del 7-oct-2026: el mismo orden que en el formulario de obra (Simón Bolívar, Simón Rodríguez, Ezequiel Zamora).
  const ordenSectores = ['Convenio Chinos', 'Convenio Rusos', 'Convenio Bielorrusos'];
  const claves = Object.keys(SECTOR_POR_CONVENIO).sort(function(a, b){ const i = ordenSectores.indexOf(a), j = ordenSectores.indexOf(b); return (i < 0 ? 99 : i) - (j < 0 ? 99 : j); });
  conv.innerHTML = '<option value="">— Seleccione sector —</option>' + claves.map(function(c){
    return '<option value="' + escapar(c) + '">' + escapar(_nombreZona(c)) + '</option>'; }).join('');
  if (v && SECTOR_POR_CONVENIO[v]) conv.value = v;
}
function _torresDelSector(){
  if (!_SECTOR_PRIMERO) return;
  const sel = document.getElementById('torre');
  [...sel.options].forEach(function(o){
    if (!o.value) { o.textContent = _sectorElegido ? '— Seleccione torre —' : '— Elija primero el sector —'; return; }
    if (o.value === 'ZONA') return;
    const ok = !_sectorElegido || (entradasDe(o.value) || []).some(function(x){ return x.c === _sectorElegido; });
    o.hidden = !ok; o.disabled = !ok;
  });
}
function _unicos(l){ const r = []; l.forEach(function(x){ x = String(x || '').trim(); if (x && r.indexOf(x) < 0) r.push(x); }); return r; }
function _empresasDeTodas(){
  return _unicos([_propios.empresa].concat([].concat.apply([], _otras.map(function(t){ return _entradasDelSector(t).map(function(x){ return x.e; }); }))));
}
// Empresa y residente de «Varias»: los de la principal más los de las demás.
function _asignarATodas(){
  if (_modoDonde !== 'varias') return;
  const res = _unicos([_propios.residente].concat([].concat.apply([], _otras.map(function(t){ return _entradasDelSector(t).map(function(x){ return x.r; }); }))));
  document.getElementById('empresa').value = _empresasDeTodas().join(' · ');
  document.getElementById('residente').value = res.join(' · ');
}
function _recordarPropios(){
  _propios = { empresa: document.getElementById('empresa').value, residente: document.getElementById('residente').value };
}
function _alCambiarOtras(){ _asignarATodas(); _pintarDonde(); actualizarNro(); marcar(); }
function quitarOtra(i){ _otras.splice(i, 1); _alCambiarOtras(); }

function _pintarDonde(){
  document.querySelectorAll('#campo-donde .donde button').forEach(function(b){
    const on = b.dataset.m === _modoDonde; b.classList.toggle('on', on); b.setAttribute('aria-checked', on ? 'true' : 'false');
  });
  const principal = document.getElementById('torre').value;
  const conv = document.getElementById('convenio').value;
  document.getElementById('torre').closest('.campo').hidden = (_modoDonde === 'zona');
  const lab = document.querySelector('label[for="convenio"]');
  if (lab) lab.textContent = (_modoDonde === 'zona' && _LUGAR === 'torre') ? 'Zona' : _etiquetaConvenio;
  ['empresa', 'residente'].forEach(function(id){
    const e = document.getElementById(id);
    if (e && _placeholders[id]) e.placeholder = (_modoDonde === 'zona' && _LUGAR === 'torre') ? 'Si aplica, escríbalo aquí' : _placeholders[id];
  });
  document.getElementById('donde-ayuda').textContent =
    _modoDonde === 'varias' ? 'Elija abajo la ' + (_LUGAR === 'manzana' ? 'manzana principal' : 'torre principal') +
                              ' (ahí se archiva el informe) y agregue las demás.'
  : _modoDonde === 'zona'   ? 'Para lo que no es de una ' + _LUGAR + ' sino de toda la zona. Se archiva en la carpeta «General» de la zona.'
  : '';
  const campo = document.getElementById('campo-otras');
  campo.hidden = (_modoDonde === 'una');
  if (campo.hidden) return;
  const zona = _modoDonde === 'zona';
  document.getElementById('otras-lista').innerHTML = _otras.map(function(x, i){
    return '<span class="otra">' + escapar(x) + '<button type="button" aria-label="Quitar ' + escapar(x) + '" onclick="quitarOtra(' + i + ')">✕</button></span>';
  }).join('');
  const candidatos = zona
    ? Object.keys(SECTOR_POR_CONVENIO).map(_nombreZona).filter(function(z){ return z !== _nombreZona(conv); })
    : torresUnicas().filter(function(t){ return t !== principal && (!_sectorElegido || (entradasDe(t) || []).some(function(x){ return x.c === _sectorElegido; })); });
  const sel = document.getElementById('otra-lugar');
  sel.innerHTML = '<option value="">' + (zona ? '＋ Agregar otra zona' : _TXT_DONDE.otra) + '</option>' +
    candidatos.filter(function(x){ return _otras.indexOf(x) < 0; })
              .map(function(x){ return '<option value="' + escapar(x) + '">' + escapar(x) + '</option>'; }).join('');
  // Lo que está entre dos contratistas se asigna a las dos (Skarlet, 30-sep).
  let emp = '';
  if (!zona && _otras.length) {
    const n = _empresasDeTodas().length;
    if (n > 1) emp = 'Se asigna a las ' + n + ' empresas de estas ' + _TXT_DONDE.plural + '.';
  }
  document.getElementById('otras-empresas').textContent = emp;
}

function ponerModoDonde(m){
  if (m === _modoDonde) return;
  const antes = _modoDonde;
  _modoDonde = m;
  const torre = document.getElementById('torre');
  if (m === 'zona') {
    _otras = [];
    _asegurarOpcionZona(); torre.value = 'ZONA'; alElegirTorre();
  } else {
    if (m === 'una' || antes === 'zona') _otras = [];
    if (antes === 'zona') { torre.value = ''; alElegirTorre(); }
    if (antes === 'varias' && m === 'una') {
      document.getElementById('empresa').value = _propios.empresa; document.getElementById('residente').value = _propios.residente;
    }
    if (m === 'varias' && antes === 'una') _recordarPropios();
  }
  _pintarDonde(); actualizarNro(); marcar();
}

function _textoUbicacion(){
  const t = document.getElementById('torre').value;
  if (_modoDonde === 'zona') return 'Toda la zona ' + _nombreZona(document.getElementById('convenio').value) + (_otras.length ? ' · ' + _otras.join(' · ') : '');
  if (_modoDonde === 'varias') return [t].concat(_otras).filter(Boolean).join(' · ');
  return '';
}

// La zona se elige donde va el convenio: los tres convenios son las tres zonas.
function _zonaElegida(){
  if ('ZONA' !== _torreAnterior && !_cargando && soloHeredado()) soltarHeredado();
  _torreAnterior = 'ZONA';
  const conv = document.getElementById('convenio');
  if (_LUGAR === 'torre') {
    const v = conv.value;
    conv.innerHTML = '<option value="">— Seleccione zona —</option>' + Object.keys(SECTOR_POR_CONVENIO).map(function(c){
      return '<option value="' + escapar(c) + '">' + escapar(_nombreZona(c)) + '</option>'; }).join('');
    if (v && SECTOR_POR_CONVENIO[v]) conv.value = v;
    if (!_cargando) { document.getElementById('empresa').value = ''; document.getElementById('residente').value = ''; }
  } else if (typeof EMPRESA_POR_SECTOR !== 'undefined' && !_cargando) {
    document.getElementById('empresa').value = EMPRESA_POR_SECTOR[conv.value] || '';
    document.getElementById('residente').value = '';
  }
  document.getElementById('aviso-torre').innerHTML = '';
  actualizarNro(); marcar();
  ofrecerHistorial();
  pedirHistorialAlRelevo();
}

const _alElegirTorreBaseU = alElegirTorre;
alElegirTorre = function(){
  const t = document.getElementById('torre').value;
  if (t === 'ZONA') { _modoDonde = 'zona'; _pintarDonde(); return _zonaElegida(); }
  if (_modoDonde === 'zona') { _modoDonde = 'una'; _otras = []; }
  const r = _alElegirTorreBaseU.apply(this, arguments);
  if (_SECTOR_PRIMERO) {
    // El motor rehace el desplegable con los convenios de la torre: se devuelven los tres sectores.
    const conv = document.getElementById('convenio');
    const filas = entradasDe(t) || [];
    if (t && _sectorElegido && filas.some(function(x){ return x.c === _sectorElegido; })) {
      _opcionesSector(); conv.value = _sectorElegido;
      const f = filas.find(function(x){ return x.c === _sectorElegido; });
      if (!_cargando) { document.getElementById('empresa').value = f.e || ''; document.getElementById('residente').value = f.r || ''; }
      document.getElementById('aviso-torre').innerHTML = '';
      actualizarNro(); pedirHistorialAlRelevo();
    } else {
      const v = conv.value;
      _opcionesSector();
      if (v) { conv.value = v; _sectorElegido = v; }
    }
    _torresDelSector();
  }
  if (_otras.indexOf(t) >= 0) _otras.splice(_otras.indexOf(t), 1);   // la principal no es «también»
  if (!_cargando) { _recordarPropios(); _asignarATodas(); }
  _pintarDonde();
  return r;
};

const _alElegirConvenioBaseU = alElegirConvenio;
alElegirConvenio = function(){
  if (_modoDonde !== 'zona') {
    if (_SECTOR_PRIMERO) {
      _sectorElegido = document.getElementById('convenio').value;
      const torre = document.getElementById('torre');
      if (torre.value && !(entradasDe(torre.value) || []).some(function(x){ return x.c === _sectorElegido; })) {
        torre.value = ''; alElegirTorre();
        document.getElementById('convenio').value = _sectorElegido;
      }
      _otras = _otras.filter(function(t){ return (entradasDe(t) || []).some(function(x){ return x.c === _sectorElegido; }); });
      _torresDelSector();
    }
    const r = _alElegirConvenioBaseU.apply(this, arguments);
    if (!_cargando) { _recordarPropios(); _asignarATodas(); }
    _pintarDonde(); return r;
  }
  const c = document.getElementById('convenio').value;
  if (_SECTOR_PRIMERO) _sectorElegido = c;
  if (typeof llenarManzanas === 'function') llenarManzanas(c);
  _asegurarOpcionZona(); document.getElementById('torre').value = 'ZONA';
  if (typeof EMPRESA_POR_SECTOR !== 'undefined' && !_cargando) document.getElementById('empresa').value = EMPRESA_POR_SECTOR[c] || '';
  const nombre = _nombreZona(c);
  if (_otras.indexOf(nombre) >= 0) _otras.splice(_otras.indexOf(nombre), 1);
  _pintarDonde(); actualizarNro(); marcar();
  pedirHistorialAlRelevo();
};

// En urbanismo el desplegable de manzanas se rehace al elegir sector: la opción
// ZONA se repone y, si estaba elegida, se conserva.
if (typeof llenarManzanas === 'function') {
  const _llenarManzanasBaseU = llenarManzanas;
  llenarManzanas = function(){
    const eraZona = document.getElementById('torre').value === 'ZONA';
    const r = _llenarManzanasBaseU.apply(this, arguments);
    if (eraZona || _modoDonde === 'zona') { _asegurarOpcionZona(); document.getElementById('torre').value = 'ZONA'; }
    return r;
  };
}

const _actualizarNroBaseU = actualizarNro;
actualizarNro = function(){
  const r = _actualizarNroBaseU.apply(this, arguments);
  if (_modoDonde === 'varias' && _otras.length) {
    const el = document.getElementById('nro');
    const t = limpiar(document.getElementById('torre').value);
    if (t) el.textContent = el.textContent.replace('-' + t + '-', '-' + t + '+' + _otras.length + '-');
  }
  return r;
};

const _datosDelFormularioBaseU = datosDelFormulario;
datosDelFormulario = function(){
  const d = _datosDelFormularioBaseU.apply(this, arguments);
  if (_modoDonde !== 'una') d.ubicacion = { modo: _modoDonde, otras: _otras.slice(), texto: _textoUbicacion() };
  return d;
};

const _faltanBaseU = faltan;
// Cada informe se revisa con SU ubicación, no con la de la pantalla: «Enviar» pasa
// por aquí con todos los borradores pendientes (QC del 30-sep-2026).
faltan = function(d){
  let f = _faltanBaseU.apply(this, arguments);
  const u = (d && d.ubicacion) || {};
  const modo = (d && d.torre === 'ZONA') ? 'zona' : (u.modo || 'una');
  if (modo === 'zona') f = f.map(function(x){ return /convenio|sector/.test(x) ? 'la zona' : x; });
  else if (_SECTOR_PRIMERO) f = f.map(function(x){ return x === 'el convenio' ? 'el sector' : x; });
  if (modo === 'varias' && !(u.otras || []).length) f.push('las otras ' + _TXT_DONDE.plural + ' (o elija «' + _TXT_DONDE.una + '»)');
  return f;
};

const _vaciarFormularioBaseU = vaciarFormulario;
vaciarFormulario = function(){
  _modoDonde = 'una'; _otras = [];
  const r = _vaciarFormularioBaseU.apply(this, arguments);
  _pintarDonde();
  return r;
};

const _cargarInformeBaseU = cargarInforme;
cargarInforme = function(id){
  const d = listaGuardada().find(function(x){ return x.id === id; });
  if (d && d.torre === 'ZONA') _asegurarOpcionZona();
  if (d && _SECTOR_PRIMERO && d.convenio) _sectorElegido = d.convenio;
  const r = _cargarInformeBaseU.apply(this, arguments);
  if (d && idActual === d.id) {
    const u = d.ubicacion || {};
    _modoDonde = d.torre === 'ZONA' ? 'zona' : (u.modo === 'varias' ? 'varias' : 'una');
    _otras = (u.otras || []).slice();
    const e0 = String(d.empresa || '').split(' · ')[0], r0 = String(d.residente || '').split(' · ')[0];
    _propios = { empresa: e0, residente: r0 };
    _pintarDonde(); actualizarNro();
  }
  return r;
};

// ── Un informe de varias torres también es la visita anterior de las demás (v116, 2-oct-2026) ──
// Se archiva una sola vez, en la principal, y hasta ahora solo la principal lo recordaba: al volver solo a la
// T-14, el formulario no ofrecía los hallazgos del informe hecho para la T-15, la T-14 y la T-13. Ahora la memoria
// del teléfono lo anota en cada una (y el relevo hace lo mismo para los demás teléfonos: VariasTorres.gs). Un
// informe propio de la torre, más nuevo, sigue mandando: la regla de fechas es la de siempre.
const _anotarEstadoTorreBaseU = anotarEstadoTorre;
anotarEstadoTorre = function(d){
  _anotarEstadoTorreBaseU.apply(this, arguments);
  const u = d && d.ubicacion;
  if (!u || u.modo !== 'varias') return;
  (u.otras || []).forEach(function(o){
    if (o && o !== d.torre) _anotarEstadoTorreBaseU(Object.assign({}, d, { torre: o }));
  });
};

_pintarDonde();
_torresDelSector();

// ── Modo oficina y «copiar de otra torre» para servicios, SHA y urbanismo (v144, 7-oct-2026) ──────────────
// Lo que obra tiene desde la v133 (modo oficina, cambio 169) y la v139 (copiar mediciones, comun/copiar_de.js),
// en el motor de servicios. Entra al final del motor, antes del service worker, y envuelve funciones del motor
// (datosDelFormulario, guardar, cargarInforme, vaciarFormulario, enviar, enviarSolo, marcar, tocado, ofrecerHistorial),
// así SHA y urbanismo lo heredan con sus propias reglas de «traer lo anterior».
//
// MODO OFICINA. En pantalla ancha con puntero fino (o ?oficina=1): un panel lista los informes de esta torre (o manzana)
// que el relevo tiene archivados (accion 'oficina-lista', con `tipo`), abre uno completo con sus fotos ('oficina-abrir')
// como un informe más de este equipo, y «Cerrar versión definitiva» lo reenvía con datos.definitiva = {por, fecha, desde}.
// El relevo r50 contesta por tipo y echa el tipo de vuelta: si no lo echa (relevo viejo), no se mezcla nada y se avisa.
//
// COPIAR. Con la torre elegida y el formulario en blanco: «📋 Copiar de otra torre…» (en urbanismo, «de otra manzana»).
// Las fuentes son los informes de las torres de la misma contratista en el sector (este teléfono y el archivo, últimos
